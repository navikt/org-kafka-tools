name: Deploy Kafka CLI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select GCP environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      aiven-secret:
        description: Aiven secret med korrekte rettigheter to mount, f.eks. aiven-org-kafka-manager-cg37ax1v
        required: true

env:
  POOL: nav-${{ github.event.inputs.environment }}
  SECRET: ${{ github.event.inputs.aiven-secret }}

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      actions: "write"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Build and push Docker image
        uses: nais/docker-build-push@078e460885ed0424b60d45ce9220b4be1748be9d # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: org
          image_suffix: kafka-cli
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy:
    needs: build-docker-image
    runs-on: ubuntu-latest
    name: Deploy til ${{ github.event.inputs.environment }}-gcp
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Deploy til nais
        uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1 # ratchet:nais/deploy/actions/deploy@v2
        env:
          RESOURCE: .nais/nais.yml
          PRINT_PAYLOAD: true
          CLUSTER: ${{ github.event.inputs.environment }}-gcp
          VAR: image=${{needs.build-docker-image.outputs.image}},pool=${{ env.POOL }},secret=${{ env.SECRET }}
